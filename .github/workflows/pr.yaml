name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job only reads; the repository default token scope is broader.
permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      # 22, the Flex host's runtime: testing on another version proves the wrong thing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint and test
        run: yarn check

  client:
    name: Client Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Own project and lockfile: root `yarn check` misses it, and otherwise only the tag publish builds it.
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint, typecheck, test and build
        run: |
          yarn lint
          yarn typecheck
          yarn test
          yarn build

  validate-bicep:
    name: Validate Bicep Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No Azure login: `az bicep build` is local, and loginless makes deploying from here impossible.
      - name: Validate Bicep template
        run: az bicep build --file ./azure/main.bicep
