# Deploy the analytics API to the staging Flex Consumption app. Application only: the CI identity
# holds Website Contributor on that one app, so it cannot run an ARM deployment. The estate is
# deployed by hand with `scripts/deploy-infra.sh`, from an operator login. Details: README "Deploy".

name: Deploy analytics to Azure staging

on:
  push:
    branches:
      - main
    paths:
      # Mirrors `scripts/package-api.py`, which decides what actually ships. Infrastructure paths are
      # deliberately absent: a Bicep change does not deploy itself.
      - 'index.js'
      - 'host.json'
      - 'package.json'
      - 'yarn.lock'
      - 'src/**'
      - 'scripts/package-api.py'
      - '.github/workflows/azure-deploy-staging-api.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  API_FLEX_APP_NAME: analytics-api-fc-test

jobs:
  deploy-api:
    name: Build & Deploy API (Azure Function App)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM to
    # `repo:digitalspace/eagle-analytics:environment:test`; only a federated credential registered
    # for that subject on analytics-cicd-test matches it.
    environment: test
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        # Depth 0 because BUILD_ID comes from `git describe --tags`: at depth 1 the tag refs arrive
        # with no ancestry path from HEAD and describe fails.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      # 22, the Flex host's runtime (azure/modules/api-function-flex.bicep).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      # Dependencies only. Packaging belongs to `scripts/package-api.py`.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Dev dependencies are most of the package's file count, and the Flex extract phase is paid
      # per file. Nothing after this step needs them.
      - name: Drop dev dependencies from the package
        run: yarn workspaces focus --production

      # `config-zip`: a Flex app has no Kudu wwwroot to POST a zip into — it publishes to the
      # deployment blob container.
      - name: Deploy the API to the Flex app
        run: |
          set -euo pipefail
          export BUILD_ID="$(git describe --tags --always --dirty)-$(date -u +%H%M%S)"
          python3 scripts/package-api.py . /tmp/api-flex.zip
          az functionapp deployment source config-zip \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$API_FLEX_APP_NAME" \
            --src /tmp/api-flex.zip

      # Deployed is not the same fact as serving. `/health` needs no auth (src/http/routes.js) and
      # host.json sets routePrefix "" so it is not under /api. The retries cover the cold start
      # after a publish: a Flex app answers 503 until the new worker is up.
      - name: Smoke test the deployed API
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors \
            "https://${API_FLEX_APP_NAME}.azurewebsites.net/health"

      - name: Report failure to the job summary
        if: failure()
        run: |
          echo "### API deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the step logs above for packaging, config-zip or smoke test errors." >> "$GITHUB_STEP_SUMMARY"
