# Publish the browser client to GitHub Packages from a `client-v*` tag.
#
# Its own tag series, because `client/` releases on its own cadence: the API deploys from main, the
# package only when a consumer needs a new version.

name: Publish analytics client

on:
  push:
    tags:
      - 'client-v*'

concurrency:
  group: publish-client-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # write, not read: the run creates the release for the tag and uploads the build to it.
  contents: write
  packages: write

defaults:
  run:
    working-directory: client

jobs:
  publish:
    name: Build & publish @digitalspace/eagle-analytics-client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      # The tag names the version, package.json holds it, and a mismatch publishes something nobody
      # asked for. Checked before the build so the run fails in seconds.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "client-v${PACKAGE_VERSION}" ]; then
            echo "Tag $TAG does not match client/package.json version $PACKAGE_VERSION."
            exit 1
          fi
          # The later steps name the artifact off the version this step just verified, rather than
          # deriving it again.
          {
            echo "VERSION=${PACKAGE_VERSION}"
            echo "TARBALL=eagle-analytics-client-${PACKAGE_VERSION}.tgz"
          } >> "$GITHUB_ENV"

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # `publishConfig.registry` in client/package.json points at GitHub Packages; the token is the
      # run's own, which can write packages in this repository and nothing else.
      - name: Publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn npm publish

      # `client/dist` is gitignored, so the tag on its own carries no build and a copy vendored into
      # eagle-admin or eagle-public cannot be traced back to a release. The tarball is the release
      # artifact; SHA256SUMS is what a consumer records next to its vendored copy.
      #
      # `yarn pack` rather than `npm pack`: same tarball, and `--out` names it without a rename step.
      - name: Pack the release assets
        run: |
          set -euo pipefail
          yarn pack --out "$TARBALL"
          # dist paths are relative to client/, which is also the tarball's `package/` root, so one
          # file verifies both: `sha256sum -c SHA256SUMS --ignore-missing` beside the download, and
          # the same from inside the extracted `package/`.
          {
            sha256sum "$TARBALL"
            find dist -type f -print0 | sort -z | xargs -0 sha256sum
          } > SHA256SUMS
          {
            echo "### $TARBALL"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach them to the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Browser client ${VERSION}. Vendoring and verification: client/README.md."
          fi
          gh release upload "$TAG" "$TARBALL" SHA256SUMS --clobber

      - name: Report failure to the job summary
        if: failure()
        run: |
          echo "### Client publish failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check which step failed: the package may have reached GitHub Packages before it." >> "$GITHUB_STEP_SUMMARY"
          echo "The registry refuses a version it already holds, so a retry needs a new patch version." >> "$GITHUB_STEP_SUMMARY"
